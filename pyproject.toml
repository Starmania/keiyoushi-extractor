[project]
name = "keiex"
version = "0.1.0"
description = "Extracts extension metadata, history, issues and stats into the linker database"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "markdown-it-py[linkify]>=3.0",
]

[project.scripts]
keiex = "keiex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keiex"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

